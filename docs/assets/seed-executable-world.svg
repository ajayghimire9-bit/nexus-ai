<text x="820" y="298" font-size="15">0.453393</text>
<text x="40" y="350" font-size="14">Fixed − induced: +0.238707 [0.223296, 0.254117]; exploratory paired t95%, df=7.</text>
<text x="40" y="375" font-size="13">Zero error is on authored tasks whose exact rule is inside the supplied 90-predicate grammar.</text>
<text x="40" y="415" font-size="18" font-weight="700">Separate controls (mean Brier; lower is better)</text>
<text x="40" y="445" font-size="15">noise</text>
