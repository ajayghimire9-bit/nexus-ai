<text x="845" y="595" font-size="13">0.47521</text>
<text x="40" y="645" font-size="14">12/16 features retained; all four unavailable-information proposals rejected.</text>
<text x="40" y="674" font-size="14">GRU32 source BCE decreased sharply, but final prediction generalized poorly.</text>
<text x="40" y="699" font-size="13">This is a negative result for the locked 96-history / 200-update recipe, not for recurrence generally.</text>
<text x="40" y="732" font-size="14">6.560 s host wall · 22,925 authored observations · 3,200 new baseline updates · 316.75 MiB RSS</text>
<text x="40" y="759" font-size="12">No control, feature-transfer, investigation-transfer or learning-to-learn conclusion.</text>
