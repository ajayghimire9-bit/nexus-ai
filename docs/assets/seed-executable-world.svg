<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">History-feature induction: first authored source-development study</title>
<desc id="desc">Primary Brier scores with exploratory task intervals; noisy and unavailable-information controls; GRU source fitting. Lower Brier is better.</desc>
