name: Research proposal
description: Propose a falsifiable question; this does not authorize execution.
title: "[Research] "
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and competing explanation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence and reusable modules
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Baselines, independent units, metrics, and failure criteria
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Proposed budget and data boundaries
      description: State what is unused, closed, private, or missing. Do not register or spend resources here.
    validations:
      required: true
