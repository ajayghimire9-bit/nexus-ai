[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "NEXUS Seed: local teachable-agent research with preserved control and learning experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
seed = ["torch>=2.2", "numpy>=1.26"]
research = ["torch>=2.2", "numpy>=1.26", "gymnasium>=0.29", "pyyaml>=6.0"]

[project.scripts]
nexus = "nexus.seed.cli:main"
nexus-seed = "nexus.seed.cli:main"
nexus-research = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not checkpoint_integrity'"
markers = [
  "checkpoint_integrity: local weight-file audit; fails if a recorded file is missing or mismatched",
]
