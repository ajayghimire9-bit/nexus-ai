# Independent second task. Not a transfer experiment: a separately trained agent.
architecture:
  hidden_sizes: [64, 64]
  activation: tanh
  shared_backbone: false
  init: orthogonal

ppo:
  env_id: Acrobot-v1
  num_envs: 4
  total_timesteps: 250000
  num_steps: 128
  update_epochs: 10
  num_minibatches: 4
  learning_rate: 0.0003
  seed: 2
  device: cpu
  normalize_obs: false
  anneal_lr: false
  clip_vloss: false
  checkpoint_dir: checkpoints/acrobot

evaluation:
  episodes: 20
  seed: 20000
